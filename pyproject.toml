[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shortenpath"
version = "0.2.0"
description = "Shorten a filesystem path to fit a terminal column budget: home folds to ~, the root and file name stay, the middle goes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["path", "shorten", "ellipsis", "elide", "display", "terminal", "width", "tilde", "unc", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Filesystems",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.scripts]
shortenpath = "shortenpath._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/shortenpath"
Issues = "https://github.com/JaviLianes8/shortenpath/issues"
Changelog = "https://github.com/JaviLianes8/shortenpath/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/shortenpath"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
